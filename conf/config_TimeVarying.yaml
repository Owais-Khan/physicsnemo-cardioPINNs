defaults :
  - physicsnemo_default
  - arch:
      - fully_connected
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: grad_norm
  - _self_

scheduler:
  decay_rate: 0.95
  decay_steps: 5000

training:
  rec_results_freq: 100
  rec_constraint_freq: 100
  rec_monitor_freq: 100
  rec_inference_freq: 100
  max_steps : 50000

stop_criterion:
  metric: 'InteriorVelocity'
  min_delta: 0.5
  patience: 1000
  mode: 'max'
  freq: 1000
  strict: true

batch_size:
  inlet: 100
  outlet: 100
  no_slip: 1000
  interior: 6000
  integral_continuity: 100
  data: 1024
