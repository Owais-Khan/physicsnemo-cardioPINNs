defaults :
  - physicsnemo_default
  - arch:
      - fully_connected
  - scheduler: tf_exponential_lr
  - optimizer: adam
  - loss: lr_annealing
  - _self_

arch:
    fully_connected:
        layer_size: 128
        nr_layers: 4

optimizer: 
  lr: 1e-2

scheduler:
  decay_rate: 0.95
  decay_steps: 100000


training:
  rec_results_freq: 100
  rec_constraint_freq: 100
  rec_monitor_freq: 100
  rec_inference_freq: 100
  max_steps : 1000000

stop_criterion:
  metric: "InteriorVelocity"
  min_delta: 0.5
  patience: 100
  mode: "max"
  freq: 100
  strict: true

batch_size:
  inlet: 100
  outlet: 100
  no_slip: 1000
  interior: 3000
  integral_continuity: 100
  data: 1024
